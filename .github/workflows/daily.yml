name: Daily forecast

on:
  schedule:
    - cron: "30 22 * * *"   # 22:30 UTC every day: after the US close (crypto updates on weekends too)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update.py
      - name: Commit new forecast
        run: |
          git config user.name "vol-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast.json
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -m "Daily forecast $(date -u +%F)"
          git push
